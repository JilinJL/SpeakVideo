name: checks
on: [push, pull_request]
jobs:
  workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check speakvideo tests scripts
      - run: uv run ruff format --check speakvideo tests scripts
      - run: uv run pytest -q
      - run: node --check speakvideo/static/app.js
      - run: node --check speakvideo/static/runtime.js
      - run: node --check speakvideo/static/video-design.js
      - run: node --check speakvideo/static/video-editor.js
      - run: uv build
      - run: uv run python scripts/check_release.py
