# Copy to config.local.toml. Secrets belong in environment variables.
[tts]
mode = "direct" # direct (local Qwen), gateway (Windows via WSS), demo (test tones)
base_url = "http://127.0.0.1:8001"
# Optional: actual local Qwen PT directory. If omitted, discover via /api/pt/list.
# local_pt_root = "/home/example/crafts/qwen3-tts-base-web/pt"
worker_id = "example-worker" # Required routing target in gateway mode.
timeout_seconds = 300
job_timeout_seconds = 1800
poll_interval_seconds = 1
max_retries = 2
# Bump when the remote model/torch/generation settings change.
generation_revision = "qwen3-base-1.7b-v1"

[llm]
base_url = "https://api.stepfun.com/step_plan/v1"
model = "step-5-preview" # Configure your own key via the editor or SPEAKVIDEO_LLM_API_KEY.
json_mode = true
timeout_seconds = 180

[script]
max_line_chars = 200

[audio]
master_lufs = -16
master_true_peak = -1.5
bgm_volume = 0.18
# narration uses -16 LUFS / -1.5 dBTP, raw segments remain 24kHz.
