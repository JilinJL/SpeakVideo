# Optional: copy to config.local.toml. The setup page also works without this file.
[tts]
mode = "managed" # managed: bundled local inference; direct: existing local Qwen; demo: test tones
base_url = "http://127.0.0.1:8001" # direct mode only
# local_pt_root = "/absolute/path/to/existing-qwen/pt" # direct mode only
max_retries = 2
timeout_seconds = 300
generation_revision = "qwen3-runtime-v1"

[runtime]
model = "base-small" # base-small: 0.6B Base; base: 1.7B Base
source = "huggingface" # or modelscope; no silent source switching
# models_dir = "/absolute/path/to/models" # parent of Qwen3-TTS-12Hz-… folders
# Environment/config is separate from model weights; no second repository needed.
device = "auto" # auto / mps / cuda:0
port = 8001
offline = false

[llm]
# Configure cloud API keys or local services in the workbench; model intentionally unset.
base_url = "https://api.openai.com/v1"
model = ""
json_mode = true
timeout_seconds = 180

[script]
max_line_chars = 200

[audio]
master_lufs = -16
master_true_peak = -1.5
bgm_volume = 0.18
