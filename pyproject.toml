[project]
name = "speakvideo"
version = "0.1.0"
description = "Mac orchestration for reproducible dialogue audio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "typer>=0.12,<1", "python-multipart>=0.0.20", "pillow>=11,<13"]

[project.scripts]
speakvideo = "speakvideo.cli:app"

[dependency-groups]
dev = [
    "filelock>=3.16,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "websockets>=15,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speakvideo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
