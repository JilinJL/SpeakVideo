[project]
name = "speakvideo"
version = "0.2.0"
description = "Standalone dialogue, voice cloning and video workbench"
readme = "README.md"
keywords = ["qwen3-tts", "voice-cloning", "text-to-speech", "ai-video", "self-hosted", "subtitles"]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "typer>=0.12,<1", "python-multipart>=0.0.20", "pillow>=11,<13", "filelock>=3.16,<4", "psutil>=6,<8"]

[project.urls]
Homepage = "https://github.com/JilinJL/SpeakVideo"
Repository = "https://github.com/JilinJL/SpeakVideo"
Documentation = "https://github.com/JilinJL/SpeakVideo#readme"
Issues = "https://github.com/JilinJL/SpeakVideo/issues"

[project.scripts]
speakvideo = "speakvideo.cli:app"

[dependency-groups]
dev = [
    "filelock>=3.16,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "websockets>=15,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speakvideo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
